<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf6f2">
  <title>Vehicle preview | H&amp;H Automotive Films</title>
  <meta name="description" content="Preview H&amp;H automotive film colors on two 3D vehicles under different lighting.">
  <link rel="icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="./vehicle.css">
  <script type="module" src="./vehicle.js"></script>
</head>
<body>
  <header class="mast">
    <div class="identity"><a id="home" href="/"><img src="../assets/hh-logo.png" width="82" height="42" alt="H&amp;H"></a><h1 data-label="title">Vehicle preview</h1></div>
    <nav><a class="back" id="back" href="./"><span aria-hidden="true">←</span> <span data-label="back">Color Studio</span></a>
      <select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option><option value="ru">Русский</option></select></nav>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="3D preview">
      <div id="canvas-host"></div>
      <div class="caption"><span id="code">TPU-010S</span><h2 id="name">Crystal Sky Blue</h2></div>
      <span id="gesture" data-label="gesture">Drag to rotate · Scroll or pinch to zoom</span>
      <div id="live" role="status" aria-live="polite"></div>
      <div id="notice" hidden><div><p id="notice-text"></p><div class="notice-actions"><button type="button" id="retry" data-label="retry">Try again</button><a id="fallback-back" href="./" data-label="back">Color Studio</a></div></div></div>
    </section>
    <aside class="controls" id="controls">
      <div class="color-picker"><label for="color" data-label="color">Film color</label><div class="color-input"><span id="chip" aria-hidden="true"></span><select id="color"></select></div>
        <div class="paging"><button id="previous" type="button" aria-label="Previous color">←</button><span id="count"></span><button id="next" type="button" aria-label="Next color">→</button></div>
      </div>
      <fieldset><legend data-label="view">View</legend><div class="options" id="views">
        <button type="button" data-view="car" data-label="car">Full vehicle</button><button type="button" data-view="closeup" data-label="closeup">Close-up</button>
        <button type="button" data-view="macro" data-label="macro">Material detail</button><button type="button" data-view="sphere" data-label="sphere">Paint sphere</button></div></fieldset>
      <fieldset id="vehicle-group"><legend data-label="vehicle">Vehicle</legend><div class="options" id="models">
        <button data-model="model3" type="button">Model 3</button><button data-model="modely" type="button">Model Y</button></div></fieldset>
      <fieldset><legend data-label="lighting">Lighting</legend><div class="options lights" id="lights">
        <button type="button" data-light="studio" data-label="studio">Studio</button><button type="button" data-light="gallery" data-label="gallery">Daylight</button><button type="button" data-light="sunset" data-label="sunset">Sunset</button></div></fieldset>
    </aside>
  </main>
  <footer><span data-label="note">Screen colors are approximate. Use a physical sample for final selection.</span>
    <a href="./models/ATTRIBUTION.txt" data-label="credits">3D model credits</a></footer>
  <noscript><p>Enable JavaScript to view the 3D models. <a href="./">Color Studio</a></p></noscript>
</body>
</html>
